</head>

<body>
  <app-root></app-root>
  <!-- AgenQ Agent Integration -->
  <div id="agenq-root"
    style="position: fixed; bottom: 20px; right: 20px; z-index: 10000; width: 0; height: 0; overflow: visible;"></div>
  <script src="https://cdn.agenqglobal.com/agenq-client-sdk.js"></script>
    <!-- <script src="https://cdn.agenqglobal.com/agenq-client-sdk--dev.js"></script> -->
    
  <script>
    window.addEventListener('load', () => {
      const interval = setInterval(() => {
        if (window.AGENQ?.render) {
          clearInterval(interval);
          window.AGENQ.render({
             agentId: "0d7075aa-721d-4f4a-a954-98f6a9420281",
             projectId: "1940f74c-cac4-4e12-ba88-40b758426004",
             customerCode: "DEMO-2",
          });
        }
      }, 100);
    });
  </script>
</body>

</html>
