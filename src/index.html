<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Logiflow</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
  <app-root></app-root>
  <!-- AgenQ Agent Integration -->
  <div id="agenq-root"
    style="position: fixed; bottom: 20px; right: 20px; z-index: 10000; width: 0; height: 0; overflow: visible;"></div>
  <script src="https://cdn.agenqglobal.com/agenq-client-sdk--dev.js"></script>
    <!-- <script src="https://cdn.agenqglobal.com/agenq-client-sdk--dev.js"></script> -->
    
  <script>
    window.addEventListener('load', () => {
      const interval = setInterval(() => {
        if (window.AGENQ?.render) {
          clearInterval(interval);
          window.AGENQ.render({
             agentId: "e6702944-c432-4a9d-a4cb-ff7916c145a6",
             projectId: "d2a051d0-192f-4173-a198-3f283fd1d22e",
             customerCode: "AWS",
          });
        }
      }, 100);
    });
  </script>
</body>

</html>
