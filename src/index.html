<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Logiflow</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
  <app-root></app-root>
  <!-- AgenQ Agent Integration -->
  <div id="agenq-root"
    style="position: fixed; bottom: 20px; right: 20px; z-index: 10000; width: 0; height: 0; overflow: visible;"></div>
  <script src="https://cdnstaticfiles.blob.core.windows.net/cdn/clientsdk/agenq-client-sdk--dev.js"></script>
  <script>
    window.addEventListener('load', () => {
      const interval = setInterval(() => {
        if (window.AGENQ?.render) {
          clearInterval(interval);
          window.AGENQ.render({
            agentId: "10a6b680-96d2-465b-84bb-5e3dea6aa997",
            projectId: "96f356d5-cdce-4de8-bd47-a2d0111ab164",
            customerCode: "GROUP-BENEFITS",
          });
        }
      }, 100);
    });
  </script>
</body>

</html>
